<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#1c1e21;--mu:#65676b;--pr:#1877f2;--bd:#dddfe2;--soft:#e4e6eb;--red:#e41e3f}
body.dark{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mu:#b0b3b8;--bd:#3a3b3c;--soft:#3a3b3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{font-size:26px;font-weight:700;color:var(--pr)}
.hbtns{display:flex;gap:8px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:19px;color:var(--tx)}
.bdg{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
#view{flex:1;overflow-y:auto;padding:10px 10px 16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:6px 0;color:var(--mu);font-size:10.5px;font-weight:700;position:relative}
nav button span.i{display:block;font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--pr)}nav button.on span.i{filter:none;opacity:1}
nav .bdg{top:2px;right:calc(50% - 26px)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
textarea,input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=datetime-local],select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);margin:0 0 8px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--pr);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:700}
.btn.sec{background:var(--soft);color:var(--tx)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.filebtn{background:var(--soft);border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer}
.muted{color:var(--mu);font-size:13px}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block}
.ini{background:var(--pr);color:#fff;text-align:center;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ph b{display:block;cursor:pointer}
.pm img,.pm video{width:100%;border-radius:10px;margin-top:8px;max-height:480px;object-fit:cover;background:#000}
.pt{white-space:pre-wrap;word-wrap:break-word}
.acts{display:flex;border-top:1px solid var(--bd);margin-top:10px;padding-top:6px}
.acts button{flex:1;border:0;background:none;color:var(--mu);font-weight:700;padding:8px}
.acts button.on{color:var(--pr)}
.cm{display:flex;gap:8px;margin:8px 0}
.cm .b{background:var(--soft);padding:8px 12px;border-radius:14px;font-size:15px}
.chips{display:flex;gap:8px;margin:2px 0 10px}
.chip{border:0;background:var(--soft);color:var(--tx);border-radius:18px;padding:7px 16px;font-weight:700}
.chip.on{background:var(--pr);color:#fff}
.stories{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.sc{flex:none;width:92px;height:150px;border-radius:12px;background:var(--card);position:relative;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:6px;text-align:center}
.sc .bgm{position:absolute;inset:0;background-size:cover;background-position:center}
.sc .ring{position:absolute;top:8px;left:8px;padding:2px;border-radius:50%;background:var(--pr)}
.sc .ring .av{border:2px solid var(--card)}
.sc small{position:relative;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 3px #000;word-break:break-word}
.sc.me{background:var(--card)}.sc.me small{color:var(--tx);text-shadow:none}
.sc.txt{background:linear-gradient(160deg,#1877f2,#9b51e0)}
.plus{position:relative;background:var(--pr);color:#fff;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:30px;margin-bottom:4px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:90%;overflow-y:auto}
.sheet h3{margin:0 0 12px}
#viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff}
#viewer .bars{display:flex;gap:4px;padding:10px 10px 4px}
#viewer .bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
#viewer .bars i b{display:block;height:100%;width:0;background:#fff}
#viewer .vh{display:flex;align-items:center;gap:10px;padding:6px 12px}
#viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#viewer .vb img,#viewer .vb video{max-width:100%;max-height:100%}
#viewer .vt{position:absolute;padding:24px;font-size:26px;font-weight:700;text-align:center;text-shadow:0 1px 4px #000;white-space:pre-wrap}
#viewer .tap{position:absolute;top:0;bottom:0;width:40%}
#viewer .foot{padding:12px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.li .gr{flex:1;min-width:0}
.li .gr b{display:block}.li .gr span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);font-size:14px}
.li.un .gr b,.li.un .gr span{color:var(--tx);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pr);flex:none}
.on-dot{width:11px;height:11px;border-radius:50%;background:#31a24c;display:inline-block;margin-left:5px}
h4{margin:6px 0 8px;font-size:15px;color:var(--mu)}
#chat{display:flex;flex-direction:column;height:100%}
#thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px}
.bub{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--soft);word-wrap:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--pr);color:#fff}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.cbar{display:flex;gap:8px;padding-top:8px}.cbar input{margin:0}
.cover{height:140px;border-radius:14px;background:linear-gradient(135deg,#1877f2,#9b51e0) center/cover}
.pav{margin:-44px 0 0 14px;border:4px solid var(--bg);border-radius:50%;display:inline-block;position:relative}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.prod .im{height:120px;background:var(--soft) center/cover;display:flex;align-items:center;justify-content:center;font-size:34px}
.prod div.t{padding:8px}.prod b{display:block;font-size:15px}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.set:last-child{border:0}
.sw{width:46px;height:26px;border-radius:13px;background:var(--soft);border:0;position:relative;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4);transition:.15s}
.sw.on{background:var(--pr)}.sw.on::after{left:23px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:20px;z-index:90;font-size:14px;max-width:88%;text-align:center}
.auth{max-width:420px;margin:0 auto;padding:30px 18px}
.auth h1{color:var(--pr);text-align:center;font-size:40px;margin:10px 0 4px}
.auth p.s{text-align:center;color:var(--mu);margin:0 0 20px}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.loading{text-align:center;color:var(--mu);padding:30px}
.ib.plusb{background:var(--pr);color:#fff;font-size:24px;font-weight:700;line-height:1}
.notes{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 4px}
.nt{flex:none;width:74px;text-align:center;cursor:pointer;position:relative}
.nt .nb{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:12px;padding:3px 7px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.25);max-width:86px;word-break:break-word;line-height:1.2;z-index:1}
.nt small{display:block;margin-top:3px;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mic.rec{background:var(--red);color:#fff;width:auto;border-radius:20px;padding:0 12px;font-size:14px;font-weight:700}
.bub audio{max-width:210px;height:38px;display:block}
.plusrow{display:flex;gap:12px;align-items:center;padding:14px 8px;border-radius:12px;cursor:pointer;font-weight:700;background:var(--soft);margin-bottom:10px;font-size:17px}
.plusrow span{font-size:26px}
.pri{color:var(--pr);font-weight:700;display:block}
.thumb{width:68px;height:68px;border-radius:10px;background:var(--soft) center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.prod .im{position:relative}
.spons{position:absolute;top:6px;left:6px;background:#f5a623;color:#000;border-radius:8px;padding:2px 7px;font-size:11px;font-style:normal;font-weight:700}
.prod{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://llqcmbpqxzaghicosavt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscWNtYnBxeHphZ2hpY29zYXZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDYyMDcsImV4cCI6MjEwODYyMjIwN30.ee5wlMWsva7gqoUKgVgpaBTXLX5KtaXMBQDwhthQUzQ';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={me:null,profile:null,settings:null,cache:{},fr:[],tab:'fil',filter:'all',posts:[],likes:{},coms:{},stories:{},chatWith:null,rt:null,hb:null};

/* ---------- utilitaires ---------- */
function toast(m){let t=$('#toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function errMsg(e){const m=String(e?.message||e||'');return /POINTS_INSUFFISANTS/.test(m)?'Jetons insuffisants.':/COMMISSION_IMPAYEE/.test(m)?'Paie d\'abord ta commission de vente pour publier un nouvel article.':'Erreur : '+m}
function name(p){const n=p?.full_name||p?.username||'Utilisateur';return p&&S.vip&&S.vip.has(p.id)?n+' 👑':n}
function av(p,s=40){const n=name(p);return p?.avatar_url?`<img class="av" style="width:${s}px;height:${s}px" src="${esc(p.avatar_url)}" alt="">`:`<span class="av ini" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px">${esc(n.slice(0,1).toUpperCase())}</span>`}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return"à l'instant";if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';if(s<604800)return Math.floor(s/86400)+' j';return new Date(d).toLocaleDateString('fr-FR')}
function hm(d){return new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
async function getProfiles(ids){ids=[...new Set(ids)].filter(i=>i&&!S.cache[i]);if(!ids.length)return;const{data}=await sb.from('profiles').select('*').in('id',ids);(data||[]).forEach(p=>S.cache[p.id]=p)}
async function upload(file){if(file.size>25*1024*1024)throw new Error('Fichier trop lourd (25 Mo max)');const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5);const path=`${S.me.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;const{error}=await sb.storage.from('media').upload(path,file,{contentType:file.type});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
function modal(html){closeModal();const m=document.createElement('div');m.id='modal';m.className='overlay';m.innerHTML=`<div class="sheet">${html}</div>`;m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){$('#modal')?.remove()}
function applyTheme(){document.body.classList.toggle('dark',!!S.settings?.dark_mode);document.body.style.fontSize=LS.get('u_font','16px')}

/* ---------- connexion ---------- */
const QAMI=(new URLSearchParams(location.search).get('ami')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
if(QAMI)try{localStorage.setItem('u_pending_code',QAMI)}catch(e){}
function authScreen(mode=QAMI?'up':'in'){
  $('#app').innerHTML=`<div class="auth"><h1>👋 Urbain</h1><p class="s">Retrouvez vos amis, partagez vos moments.</p>
  <div class="card">
  ${mode==='up'?'<input type="text" id="a_n" placeholder="Nom complet" autocomplete="name">':''}
  <input type="email" id="a_e" placeholder="Adresse e-mail" autocomplete="email">
  <input type="password" id="a_p" placeholder="Mot de passe (6 caractères min.)" autocomplete="${mode==='up'?'new-password':'current-password'}">
  ${mode==='up'?`<label class="muted" style="display:flex;gap:8px;align-items:flex-start;margin:0 0 10px"><input type="checkbox" id="a_r" style="width:auto;margin:3px 0 0"><span>J'accepte les <a href="#" id="a_rl" style="color:var(--pr);font-weight:700">règles de la communauté</a></span></label>`:''}
  <button class="btn" style="width:100%" id="a_go">${mode==='up'?'Créer mon compte':'Se connecter'}</button>
  <p class="muted" id="a_m" style="text-align:center;margin:10px 0 0"></p></div>
  <p style="text-align:center"><button class="btn sec" id="a_sw">${mode==='up'?'J\'ai déjà un compte':'Créer un compte'}</button></p></div>`;
  $('#a_sw').onclick=()=>authScreen(mode==='up'?'in':'up');
  const rl=$('#a_rl');if(rl)rl.onclick=e=>{e.preventDefault();rulesModal()};
  $('#a_go').onclick=async()=>{
    const email=$('#a_e').value.trim(),password=$('#a_p').value,m=$('#a_m'),b=$('#a_go');
    if(!email||password.length<6){m.textContent='E-mail et mot de passe (6 caractères min.) requis.';return}
    b.disabled=true;m.textContent='Un instant…';
    if(mode==='up'){
      const full_name=$('#a_n').value.trim();
      if(!full_name){m.textContent='Votre nom est requis.';b.disabled=false;return}
      if(!$('#a_r').checked){m.textContent='Acceptez les règles de la communauté pour continuer.';b.disabled=false;return}
      const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name}}});
      b.disabled=false;
      if(error){m.textContent=error.message;return}
      if(!data.session){m.textContent='Compte créé. Vérifiez votre e-mail pour confirmer, puis connectez-vous.'}
    }else{
      const{error}=await sb.auth.signInWithPassword({email,password});
      b.disabled=false;
      if(error)m.textContent=/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':error.message;
    }
  };
}

/* ---------- démarrage ---------- */
async function boot(user){
  S.me=user;
  let{data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!p){const r=await sb.from('profiles').insert({id:user.id,full_name:user.user_metadata?.full_name||null}).select().single();p=r.data||{id:user.id}}
  S.profile=p;S.cache[p.id]=p;
  let{data:st}=await sb.from('user_settings').select('*').eq('user_id',user.id).maybeSingle();
  if(!st){const r=await sb.from('user_settings').insert({user_id:user.id}).select().single();st=r.data||{}}
  S.settings=st;applyTheme();
  await loadFriends();await loadVip().catch(()=>{});
  shell();go('fil');subscribe();refreshBadges();heartbeat();
  usePendingCode();
}
async function usePendingCode(){
  let c=null;try{c=localStorage.getItem('u_pending_code')}catch(e){}
  if(!c)return;
  try{localStorage.removeItem('u_pending_code')}catch(e){}
  try{
    const{data,error}=await sb.rpc('add_friend_by_code',{p_code:c});
    if(error)throw error;
    if(data){await loadFriends();toast('Vous êtes maintenant amis ✅');go('chat',data)}else toast('Code d\'ami invalide.');
  }catch(e){toast(errMsg(e))}
}
function shell(){
  $('#app').innerHTML=`<header><div class="logo">👋 Urbain</div><div class="hbtns">
  <button class="ib plusb" data-act="plus">+</button>
  <button class="ib" data-act="go" data-t="events">📅</button>
  <button class="ib" data-act="go" data-t="amis">👥<span class="bdg" id="b_fr" hidden></span></button>
  <button class="ib" data-act="go" data-t="msgs">💬<span class="bdg" id="b_msg" hidden></span></button></div></header>
  <div id="view"></div>
  <nav>${[['fil','🏠','Fil'],['videos','🎬','Vidéos'],['shop','🛍️','Boutique'],['notifs','🔔','Notifs'],['profil','👤','Profil'],['reglages','⚙️','Réglages']].map(([t,i,l])=>`<button data-act="go" data-t="${t}" data-nav="${t}"><span class="i">${i}</span>${l}${t==='notifs'?'<span class="bdg" id="b_n" hidden></span>':''}</button>`).join('')}</nav>`;
}
function go(t,arg){
  if(REC){REC.send=false;REC.mr.stop()}
  S.tab=t;if(t!=='chat')S.chatWith=null;if(t!=='jeux'){lStop();pStop();dStop()}
  if(t==='profil')S.viewing=arg||S.me.id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===t));
  const v=$('#view');v.style.overflow='';v.innerHTML='<div class="loading">Chargement…</div>';v.scrollTop=0;
  ({fil:vFil,shop:vShop,notifs:vNotifs,profil:vProfil,reglages:vReglages,amis:vAmis,msgs:vMsgs,chat:vChat,groups:vGroups,group:vGroup,events:vEvents,videos:vVideos,jeux:vJeux,ia:vIA})[t](arg).catch(e=>{v.innerHTML=`<div class="empty">Erreur : ${esc(e.message||e)}</div>`});
}
function badge(id,n){const e=$(id);if(!e)return;e.hidden=!n;e.textContent=n>99?'99+':n}
async function refreshBadges(){
  badge('#b_fr',S.fr.filter(f=>f.status==='pending'&&f.addressee_id===S.me.id).length);
  const a=await sb.from('messages').select('id',{count:'exact',head:true}).eq('receiver_id',S.me.id).eq('read',false);
  badge('#b_msg',a.count||0);
  const b=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',S.me.id).eq('read',false);
  badge('#b_n',b.count||0);
}
function heartbeat(){
  clearInterval(S.hb);
  const f=async()=>{if(!S.me)return;await sb.from('profiles').update({last_seen:S.settings?.show_online===false?null:new Date().toISOString()}).eq('id',S.me.id)};
  f();S.hb=setInterval(f,60000);
}
function subscribe(){
  if(S.rt)sb.removeChannel(S.rt);
  S.rt=sb.channel('urbain-'+S.me.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`receiver_id=eq.${S.me.id}`},async p=>{
     const m=p.new;
     if(S.tab==='chat'&&S.chatWith===m.sender_id){addBubble(m);sb.from('messages').update({read:true}).eq('id',m.id)}

async function amisList(q){

    h+=`<div class="card"><h4>Mes amis (${fr.length})</h4>${fr.length?fr.map(f=>{const p=S.cache[other(f)];return userRow(p,`<button class="btn sm" data-act="chat" data-id="${p.id}">Message</button><button class="btn sm sec" data-act="unfriend" data-id="${f.id}">Retirer</button>`)}).join(''):'<div class="empty">Pas encore d\'amis. Ajoutez des personnes ci-dessous.</div>'}</div>`;

function openStory(uid){

    const bar=$('#pb'+i),vid=el.querySelector('video');

    if(vid){vid.onloadedmetadata=()=>{clearTimeout(timer);run(Math.min((vid.duration||8)*1000,30000))};timer=setTimeout(()=>run(8000),3000)}else run(5000);

  };

  if(VIO)VIO.disconnect();
  if(LS.get('u_autoplay','1')!=='1')return;
  VIO=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting&&e.intersectionRatio>.6){v.muted=true;v.play().catch(()=>{})}else v.pause()}),{threshold:[0,.6]});

}

/* ---------- RÈGLES, FILTRE ET SIGNALEMENTS ---------- */
const BAD_WORDS=['bombe artisanale','fabriquer une bombe','fabriquer des bombes','fabriquer des explosifs','fabriquer une arme','vente d armes','vend des armes','vente de drogue','vente de cocaine','vente d heroine','vente de tramadol','faux billets','faux diplomes','faux papiers','pedopornographie','porno enfant','video porno','porno gratuit','rejoindre daesh','boko haram recrute'];
function cleanTxt(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’`\-]/g,' ').replace(/\s+/g,' ')}
function guard(...txt){
  const s=cleanTxt(txt.join(' '));
  if(BAD_WORDS.some(w=>s.includes(w))){toast("Ce contenu est interdit par les règles d'Urbain.");return true}
  return false;
}

let REC=null;

function resetMic(){const b=$('#mic');if(b){b.classList.remove('rec');b.textContent='🎤'}const x=$('#micx');if(x)x.hidden=true}
async function toggleMic(){
  if(REC){REC.send=true;REC.mr.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Enregistrement vocal non pris en charge ici.');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('Micro refusé : autorisez le micro pour envoyer un vocal.')}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];
  const ctx={mr,send:false,t0:Date.now(),to:S.chatWith,tab:S.tab};REC=ctx;
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(ctx.iv);REC=null;resetMic();
    if(!ctx.send)return;
    if((Date.now()-ctx.t0)<1000)return toast('Vocal trop court.');
    try{
      const type=(mr.mimeType||mime||'audio/webm').split(';')[0];
      const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
      const url=await upload(new File([new Blob(chunks,{type})],'vocal.'+ext,{type}));
      const grp=ctx.tab==='group';
      const row=grp?{group_id:ctx.to,sender_id:S.me.id,content:'🎤 Message vocal',audio_url:url}:{sender_id:S.me.id,receiver_id:ctx.to,content:'🎤 Message vocal',audio_url:url};
      const{data,error}=await sb.from(grp?'group_messages':'messages').insert(row).select().single();
      if(error)throw error;
      if(S.tab===ctx.tab&&S.chatWith===ctx.to)(grp?addGBubble:addBubble)(data);
    }catch(e){toast('Vocal non envoyé : '+(e.message||e))}
  };
  mr.start();
  const b=$('#mic'),x=$('#micx');if(x)x.hidden=false;if(b)b.classList.add('rec');
  const tick=()=>{const s=Math.floor((Date.now()-ctx.t0)/1000);const bb=$('#mic');if(bb)bb.textContent='⏹ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=120){ctx.send=true;mr.stop()}};
  tick();ctx.iv=setInterval(tick,500);
}

/* ---------- MORPION & PUISSANCE 4 (2 joueurs en ligne) ---------- */
const DG={g:null,ch:null,iv:null,busy:false},DNAME={morpion:'Morpion',p4:'Puissance 4',course:'Course de voitures'},RACE={id:null,pos:0,sent:0,last:0,go:0,timer:null,q:null,busy:false},DCOL={morpion:['#1877f2','#e41e3f'],p4:['#e41e3f','#f5c518']};
const dMe=()=>DG.g.p1===S.me.id?0:1;
const dNew=k=>k==='course'?{pos:[0,0],t:[null,null],winner:null,msg:''}:({b:Array(k==='p4'?42:9).fill(-1),turn:0,winner:null,msg:''});
function dWin(k,b,pl){
  const lines=[];
  if(k==='morpion')[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].forEach(l=>lines.push(l));
  else for(let r=0;r<6;r++)for(let c=0;c<7;c++)[[0,1],[1,0],[1,1],[1,-1]].forEach(([dr,dc])=>{
    const e=[];for(let i=0;i<4;i++){const rr=r+dr*i,cc=c+dc*i;if(rr<0||rr>5||cc<0||cc>6)return;e.push(rr*7+cc)}lines.push(e)});
  return lines.find(l=>l.every(i=>b[i]===pl))||null}
function dStop(){clearInterval(DG.iv);clearTimeout(RACE.timer);clearTimeout(RACE.q);RACE.q=null;RACE.id=null;if(DG.ch){sb.removeChannel(DG.ch);DG.ch=null}const g=DG.g;DG.g=null;
  if(g&&g.status==='waiting'&&S.me&&g.p1===S.me.id)sb.from('duo_games').delete().eq('id',g.id).eq('status','waiting').then(()=>{})}
async function dJoin(kind,id){
  const{data,error}=await sb.from('duo_games').update({p2:S.me.id,boost2:!!S.boost,status:'playing',state:dNew(kind),updated_at:new Date().toISOString()}).eq('id',id).is('p2',null).eq('status','waiting').select();
  if(error)throw error;return data&&data[0]||null}
async function dPlay(kind){
  dStop();$('#view').innerHTML='<div class="loading">Recherche d\'une partie…</div>';
  const me=S.me.id,r1=await sb.from('duo_games').select('*').eq('kind',kind).or(`p1.eq.${me},p2.eq.${me}`).neq('status','done').order('created_at',{ascending:false}).limit(1);
  if(r1.data&&r1.data[0])return dOpen(r1.data[0]);
  if(!await needCoins())return go('jeux');
  const since=new Date(Date.now()-600000).toISOString();
  const r2=await sb.from('duo_games').select('id').eq('kind',kind).eq('status','waiting').is('p2',null).neq('p1',me).gt('created_at',since).order('created_at').limit(1);
  if(r2.data&&r2.data[0]){const j=await dJoin(kind,r2.data[0].id);if(j)return dOpen(j)}
  const r3=await sb.from('duo_games').insert({kind,p1:me,boost1:!!S.boost}).select().single();if(r3.error)throw r3.error;dOpen(r3.data)}
function dOpen(g){dStop();DG.g=g;
  DG.ch=sb.channel('duo-'+g.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'duo_games',filter:'id=eq.'+g.id},p=>{if(DG.g&&p.new.id===DG.g.id){DG.g=p.new;dRender()}}).subscribe();
  DG.iv=setInterval(async()=>{const c=DG.g;if(!c||DG.busy)return;
    const{data}=await sb.from('duo_games').select('*').eq('id',c.id).maybeSingle();
    if(data&&data.updated_at!==c.updated_at&&DG.g&&DG.g.id===c.id){DG.g=data;dRender()}
    if(DG.g&&DG.g.id===c.id&&DG.g.status==='waiting'){
      const o=await sb.from('duo_games').select('id').eq('kind',c.kind).eq('status','waiting').is('p2',null).neq('p1',S.me.id).lt('created_at',c.created_at).order('created_at').limit(1);
      if(o.data&&o.data[0]){const j=await dJoin(c.kind,o.data[0].id).catch(()=>null);if(j)dOpen(j)}}},3000);
  dRender()}
async function dSave(st,x={}){DG.busy=true;const{data,error}=await sb.from('duo_games').update({state:st,updated_at:new Date().toISOString(),...x}).eq('id',DG.g.id).select().single();DG.busy=false;if(error)return toast(errMsg(error));DG.g=data;dRender()}
async function dMove(i){
  const g=DG.g;if(!g||DG.busy||g.status!=='playing')return;
  const me=dMe(),k=g.kind,st=JSON.parse(JSON.stringify(g.state));
  if(st.turn!==me||st.winner!=null)return;
  let idx=i;
  if(k==='p4'){idx=-1;for(let r=5;r>=0;r--){if(st.b[r*7+i]===-1){idx=r*7+i;break}}if(idx<0)return toast('Colonne pleine.')}
  else if(st.b[i]!==-1)return;
  st.b[idx]=me;
  const line=dWin(k,st.b,me);
  if(line){st.winner=me;st.line=line}
  else if(st.b.every(x=>x!==-1))st.winner=-1;
  else st.turn=1-me;
  await dSave(st,st.winner!=null?{status:'done'}:{})}
async function dQuit(){const g=DG.g;
  if(g&&g.status==='playing'){if(!confirm('Abandonner la partie ?'))return;
    const st={...g.state,winner:1-dMe(),msg:'Abandon'};
    await sb.from('duo_games').update({state:st,status:'done',updated_at:new Date().toISOString()}).eq('id',g.id)}
  go('jeux')}
function dBoard(g,can){
  const k=g.kind,b=g.state.b,line=g.state.line||[],col=DCOL[k];
  if(k==='morpion')return`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:auto">${b.map((v,i)=>`<button data-dg="mv" data-i="${i}" ${can&&v===-1?'':'disabled'} style="aspect-ratio:1;border:0;border-radius:12px;background:var(--soft);font-size:44px;font-weight:700;color:${v<0?'inherit':col[v]};${line.includes(i)?'outline:4px solid #f5a623':''}">${v<0?'':['✕','◯'][v]}</button>`).join('')}</div>`;
  return`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:360px;margin:auto;background:#1877f2;padding:8px;border-radius:14px">${b.map((v,i)=>`<button data-dg="mv" data-i="${i%7}" ${can?'':'disabled'} style="aspect-ratio:1;border:0;border-radius:50%;padding:0;background:${v<0?'var(--card)':col[v]};${line.includes(i)?'box-shadow:0 0 0 4px #fff':''}"></button>`).join('')}</div>`}
/* ---------- COURSE DE VOITURES ---------- */
const RACE_CAR=c=>`<svg viewBox="0 0 40 20" width="44" height="22" style="display:block"><rect x="2" y="8" width="36" height="8" rx="3" fill="${c}"/><rect x="10" y="2" width="18" height="8" rx="3" fill="${c}"/><rect x="13" y="4" width="12" height="4" rx="1.5" fill="#cfe8ff"/><circle cx="11" cy="17" r="3.2" fill="#222"/><circle cx="29" cy="17" r="3.2" fill="#222"/></svg>`;
const raceLane=(id,c,label)=>`<div class="muted" style="margin-top:6px">${label}</div><div style="position:relative;height:40px;background:var(--soft);border-radius:10px;margin:4px 0 8px;overflow:hidden"><div style="position:absolute;right:6px;top:8px;font-size:20px">🏁</div><div id="${id}" style="position:absolute;top:9px;left:0;transition:left .2s linear">${RACE_CAR(c)}</div></div>`;
function raceSetCar(id,p){const e=$(id);if(e)e.style.left='calc((100% - 44px) * '+(Math.max(0,Math.min(100,p))/100)+')'}
function raceCount(){

  m.textContent='GO ! 👆'}
function raceTap(){
  const g=DG.g;if(!g||g.status!=='playing'||RACE.id!==g.id||Date.now()<RACE.go||RACE.pos>=100)return;
  RACE.pos=Math.min(100,RACE.pos+2);raceSetCar('#car_m',RACE.pos);
  raceSend(RACE.pos>=100)}
function raceSend(force){
  const now=Date.now();
  if(RACE.busy)return;
  if(!force&&now-RACE.last<250){if(!RACE.q)RACE.q=setTimeout(()=>{RACE.q=null;raceSend(false)},250-(now-RACE.last)+5);return}
  const g=DG.g;if(!g||g.status!=='playing')return;
  RACE.busy=true;RACE.last=now;RACE.sent=RACE.pos;const id=g.id,p=RACE.pos;
  sb.rpc('race_tap',{p_game:id,p_pos:p}).then(({data,error})=>{
    RACE.busy=false;
    if(error)return toast(errMsg(error));
    const c=DG.g;if(!c||c.id!==id||!data)return;
    const me=dMe(),srv=(data.pos&&data.pos[me])||0;
    DG.g={...c,state:data,status:data.winner!=null?'done':c.status};
    RACE.pos=Math.min(RACE.pos,srv+12);
    dRender();
    if(DG.g&&DG.g.status==='playing'&&RACE.pos>RACE.sent)raceSend(false)})}
function raceRender(g,oid){
  const v=$('#view'),me=dMe(),st=g.state||{},pos=st.pos||[0,0],opp=S.cache[oid]||{};
  if(RACE.id!==g.id){
    RACE.id=g.id;RACE.pos=0;RACE.sent=0;RACE.last=0;RACE.busy=false;RACE.go=Date.now()+3000;
    v.innerHTML=`<div class="card" id="race"><div class="ph" style="margin:0 0 6px">${av(opp,36)}<div><b>${esc(name(opp))}</b><span class="muted">Course de voitures · le premier arrivé gagne</span></div></div>`
    +raceLane('car_o','#e41e3f',esc(name(opp)))+raceLane('car_m','#1877f2','Toi')
    +`<div id="race_msg" style="text-align:center;font-weight:800;font-size:24px;margin:8px 0;min-height:32px"></div>
    <button class="btn" id="race_btn" style="width:100%;height:130px;font-size:26px;font-weight:800;border-radius:18px;touch-action:manipulation;user-select:none;-webkit-user-select:none">TAPE ! TAPE ! TAPE !</button>
    <div class="row" id="race_end" style="justify-content:center;margin-top:12px"><button class="btn sec" data-dg="quit">Abandonner</button></div></div>`;
    $('#race_btn').onpointerdown=e=>{e.preventDefault();raceTap()};

    const en=$('#race_end');if(en)en.innerHTML=(st.winner===me?winShare('jeu de Course'):'')+`<button class="btn" data-dg="play" data-k="${g.kind}">Rejouer</button><button class="btn sec" data-dg="quit">Quitter</button>`}}
async function dRender(){const g=DG.g,v=$('#view');if(!g||S.tab!=='jeux')return;

  <div class="row" style="justify-content:center;margin-top:14px">${g.status==='done'?`<button class="btn" data-dg="play" data-k="${g.kind}">Rejouer</button>`:''}<button class="btn sec" data-dg="quit">${g.status==='done'?'Quitter':'Abandonner'}</button></div></div>`}

   case'font':LS.set('u_font',id);applyTheme();return go('reglages');
   case'logoutall':if(!confirm('Se déconnecter de tous les appareils ?'))return;clearInterval(S.hb);if(S.rt)sb.removeChannel(S.rt);await sb.auth.signOut({scope:'global'});return;
   case'about':return aboutModal();
   case'plus':return plusMenu();
   case'newpost':return newPost();
   case'newnote':return newNote();
   case'delnote':if(!confirm('Supprimer votre note ?'))return;await sb.from('notes').delete().eq('id',id);return loadNotes();
   case'mic':return toggleMic();
   case'micx':if(REC){REC.send=false;REC.mr.stop()}return;
   case'addcode':{const c=($('#fc_in')?.value||'').trim();if(!c)return toast('Saisissez le code de votre ami.');
     const{data,error}=await sb.rpc('add_friend_by_code',{p_code:c});if(error)return toast(errMsg(error));
     if(!data)return toast('Code invalide. Vérifiez-le auprès de votre ami.');
     await loadFriends();toast('Vous êtes maintenant amis ✅');return go('chat',data)}
   case'copycode':{try{await navigator.clipboard.writeText(S.myCode);toast('Code copié ✅')}catch(_){toast('Code : '+S.myCode)}return}
   case'regencode':if(!confirm('Changer votre code ? L\'ancien ne fonctionnera plus.'))return;return showMyCode(true);
   case'buycoins':return coinsModal();
   case'boostsw':S.boost=!S.boost;return vJeux();
   case'reward':return rewardModal();
   case'rok':return decideReward(id,true);
   case'rno':return decideReward(id,false);
   case'coinreq':return requestCoins(+el.dataset.n);
   case'cok':return decideCoins(id,true);
   case'cno':return decideCoins(id,false);
   case'premreq':return requestPremium();
   case'newad':closeModal();return adForm();
   case'adclick':return adClick(id);
   case'adok':return decideAd(id,true);
   case'adno':return decideAd(id,false);
   case'report':return reportModal(id,el.dataset.k);
   case'rpdel':return decideReport(id,true);
   case'rpok':return decideReport(id,false);
   case'rules':return rulesModal();
   case'claimdaily':return claimDaily();
   case'pok':return decidePremium(id,true);
   case'pno':return decidePremium(id,false);
   case'logout':clearInterval(S.hb);if(S.rt)sb.removeChannel(S.rt);await sb.auth.signOut();return
  }}catch(err){toast('Erreur : '+(err.message||err))}
});
document.addEventListener('change',async e=>{
  const f=e.target.closest('[data-up]');if(!f||!f.files[0])return;
  try{toast('Envoi…');const u=await upload(f.files[0]);const{data,error}=await sb.from('profiles').update({[f.dataset.up]:u}).eq('id',S.me.id).select().single();if(error)throw error;S.profile=data;S.cache[S.me.id]=data;toast('Mis à jour ✅');go('profil')}catch(err){toast('Erreur : '+(err.message||err))}
});

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='SIGNED_OUT'||(!session&&ev!=='INITIAL_SESSION')){S.me=null;document.body.classList.remove('dark');authScreen();return}
  if(session&&(!S.me||S.me.id!==session.user.id)&&ev!=='TOKEN_REFRESHED')setTimeout(()=>boot(session.user),0);
  else if(!session&&ev==='INITIAL_SESSION')authScreen();
});
</script>
</body>
</html>
